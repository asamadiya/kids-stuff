<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Moonlit Storybook">
  <!-- Night-sky background -->
  <rect width="32" height="32" rx="6" fill="#0f0c29"/>
  <!-- Crescent moon -->
  <circle cx="19" cy="10" r="7" fill="#ffe066"/>
  <circle cx="22" cy="8" r="6" fill="#0f0c29"/>
  <!-- Stars -->
  <circle cx="6" cy="6" r="1" fill="#ffe066" opacity="0.9"/>
  <circle cx="11" cy="4" r="0.8" fill="#ffe066" opacity="0.7"/>
  <circle cx="4" cy="13" r="0.6" fill="#ffe066" opacity="0.6"/>
  <!-- Open book -->
  <rect x="5" y="20" width="10" height="8" rx="1" fill="#d4a847"/>
  <rect x="15" y="20" width="10" height="8" rx="1" fill="#e8c068"/>
  <line x1="15" y1="20" x2="15" y2="28" stroke="#8b6914" stroke-width="1"/>
  <!-- Page lines left side -->
  <line x1="7" y1="23" x2="13" y2="23" stroke="#8b6914" stroke-width="0.8" opacity="0.6"/>
  <line x1="7" y1="25" x2="13" y2="25" stroke="#8b6914" stroke-width="0.8" opacity="0.6"/>
  <!-- Page lines right side -->
  <line x1="17" y1="23" x2="23" y2="23" stroke="#8b6914" stroke-width="0.8" opacity="0.6"/>
  <line x1="17" y1="25" x2="23" y2="25" stroke="#8b6914" stroke-width="0.8" opacity="0.6"/>
</svg>
