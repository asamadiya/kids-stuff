<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Moonlit Storybook — illustrated bedtime stories for children">
  <!-- Deep night-sky gradient background -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07051a"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Moon glow -->
  <ellipse cx="900" cy="180" rx="140" ry="140" fill="url(#glow)" filter="url(#soft)"/>

  <!-- Crescent moon -->
  <circle cx="900" cy="180" r="90" fill="#ffe066"/>
  <circle cx="945" cy="148" r="78" fill="#07051a"/>

  <!-- Stars scattered -->
  <g fill="#ffe8a0" opacity="0.85">
    <circle cx="100" cy="60" r="3"/>
    <circle cx="240" cy="40" r="2"/>
    <circle cx="380" cy="90" r="2.5"/>
    <circle cx="520" cy="30" r="2"/>
    <circle cx="660" cy="70" r="3"/>
    <circle cx="780" cy="50" r="2"/>
    <circle cx="1050" cy="40" r="2.5"/>
    <circle cx="1130" cy="80" r="2"/>
    <circle cx="60" cy="150" r="1.5"/>
    <circle cx="200" cy="130" r="2"/>
    <circle cx="450" cy="140" r="1.5"/>
    <circle cx="700" cy="120" r="2"/>
    <circle cx="1100" cy="150" r="1.5"/>
  </g>

  <!-- Open book, centred-left -->
  <g transform="translate(180 310)">
    <!-- Book spine shadow -->
    <rect x="198" y="0" width="8" height="220" rx="2" fill="#5a3e10"/>
    <!-- Left page -->
    <rect x="0" y="0" width="200" height="220" rx="8" fill="#d4a847"/>
    <rect x="0" y="0" width="200" height="220" rx="8" fill="#e8c472" opacity="0.5"/>
    <!-- Left page lines -->
    <line x1="20" y1="40" x2="178" y2="40" stroke="#8b6914" stroke-width="3" opacity="0.4"/>
    <line x1="20" y1="65" x2="178" y2="65" stroke="#8b6914" stroke-width="3" opacity="0.4"/>
    <line x1="20" y1="90" x2="178" y2="90" stroke="#8b6914" stroke-width="3" opacity="0.4"/>
    <line x1="20" y1="115" x2="178" y2="115" stroke="#8b6914" stroke-width="3" opacity="0.4"/>
    <line x1="20" y1="140" x2="140" y2="140" stroke="#8b6914" stroke-width="3" opacity="0.4"/>
    <!-- Right page -->
    <rect x="206" y="0" width="200" height="220" rx="8" fill="#f0d080"/>
    <!-- Right page lines -->
    <line x1="226" y1="40" x2="384" y2="40" stroke="#8b6914" stroke-width="3" opacity="0.4"/>
    <line x1="226" y1="65" x2="384" y2="65" stroke="#8b6914" stroke-width="3" opacity="0.4"/>
    <line x1="226" y1="90" x2="384" y2="90" stroke="#8b6914" stroke-width="3" opacity="0.4"/>
    <line x1="226" y1="115" x2="384" y2="115" stroke="#8b6914" stroke-width="3" opacity="0.4"/>
    <line x1="226" y1="140" x2="340" y2="140" stroke="#8b6914" stroke-width="3" opacity="0.4"/>
    <!-- Spine highlight -->
    <rect x="198" y="0" width="8" height="220" rx="2" fill="#c8912a" opacity="0.6"/>
  </g>

  <!-- App title -->
  <text
    x="600" y="290"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    font-weight="bold"
    fill="#ffe066"
    text-anchor="middle"
    letter-spacing="2">Moonlit Storybook</text>

  <!-- Tagline -->
  <text
    x="600" y="368"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="40"
    fill="#c8b8f0"
    text-anchor="middle"
    opacity="0.9">Illustrated bedtime stories for children</text>

  <!-- Bottom URL hint -->
  <text
    x="600" y="570"
    font-family="monospace"
    font-size="28"
    fill="#8875c0"
    text-anchor="middle"
    opacity="0.7">asamadiya.github.io/kids-stuff</text>
</svg>
